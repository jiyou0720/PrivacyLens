[project]
name = "privacylens-api"
version = "0.2.0"
description = "Evidence-based privacy consent analysis API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6,<1",
  "httpx>=0.28.1,<1",
  "numpy>=2.0,<3",
  "pydantic>=2.10.4,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.4,<9", "ruff>=0.8.4,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"