[project]
name = "privacylens-api"
version = "0.1.0"
description = "Evidence-based privacy policy analysis API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115.6,<1", "pydantic>=2.10.4,<3", "uvicorn[standard]>=0.34,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.28.1,<1", "pytest>=8.3.4,<9", "ruff>=0.8.4,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
